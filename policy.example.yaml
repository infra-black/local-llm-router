backends:
  local:
    type: openai
    endpoint: http://127.0.0.1:9000/v1
    models: [qwen3-30b-a3b]
    health_check:
      path: /v1/models
      interval_seconds: 30
      timeout_seconds: 5
      unhealthy_threshold: 2
      healthy_threshold: 1
  ollama:
    type: ollama
    endpoint: http://localhost:11434
    models: [llama3.2:3b, qwen2.5-coder:7b]
  sarmalink:
    type: sarmalink
    endpoint: https://api.sarmalink.ai/v1
    model: smart
  # API key in named env var
  azure-oai:
    type: openai
    endpoint: https://myresource.openai.azure.com/openai/deployments/gpt-4o
    model: gpt-4o
    api_key_env: MY_AZURE_KEY
    # API key set in config (dangerous)
  frontier:
    type: openai
    endpoint: https://api.openai.com/v1
    model: gpt-4o
    api_key: sk-proj-XXXXXXXXXXXXXXXX
  # API key vars unset - falls back to OPENAI_API_KEY env var
  vanilla:
    type: openai
    model: gpt-4o

routes:
  - match: { sensitivity: high }
    backend: local
    reason: "Privacy: never leave the machine"

  - match: { task: code, complexity: low }
    backend: local
    fallback: sarmalink

  - match: { task: code, complexity: high }
    backend: frontier
    fallback: sarmalink

  - match: { task: web_search }
    backend: sarmalink
    reason: "Live tools available"

  - default: sarmalink
    fallback: frontier
